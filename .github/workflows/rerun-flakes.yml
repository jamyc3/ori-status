name: rerun-flakes
# Auto-retry uptime runs that failed WITHOUT executing a single step —
# the "job was not acquired by runner" GitHub infrastructure flake
# (e.g. run 29018701925). Real probe failures execute steps, so they are
# never retried here; they open incident issues instead.
#
# Note: GitHub's "Run failed" email for the flaky attempt has already been
# sent by the time this fires — this can't stop that email, but the rerun
# makes the run history self-heal so a green checkmark greets whoever
# clicks through.

on:
  workflow_run:
    workflows: ["uptime"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rerun if no step ever executed (infra flake signature)
        run: |
          run_id="${{ github.event.workflow_run.id }}"
          steps_executed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
            --jq '[.jobs[].steps | length] | add // 0')
          echo "steps executed in run $run_id: $steps_executed"
          if [ "$steps_executed" -eq 0 ]; then
            echo "Runner-acquisition flake — retrying once."
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
          else
            echo "Steps ran — real failure, leaving it to the incident issue."
          fi
