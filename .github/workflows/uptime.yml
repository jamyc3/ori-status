name: uptime
# External uptime monitor for Ori + Jot production surfaces.
#
# GitHub throttles scheduled workflows heavily (observed: fires every ~1-4 h,
# not every 5 min), so a single probe per run leaves long blind gaps. Instead,
# each fired run probes every ~5 minutes for up to ~45 minutes (9 cycles) and
# a newly fired run cancels the previous one (concurrency below), so coverage
# is a rolling window rather than a point check.
#
# On failure: the loop stops immediately, an incident issue is opened
# (watchers get notified) and the run fails so GitHub emails the owner.
# On recovery: the next green run comments on + closes the incident issue.
# Runner-acquisition flakes (job never starts) are auto-retried by
# rerun-flakes.yml.

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Force a failure to test the alert path'
        required: false
        default: 'false'
      cycles:
        description: 'Probe cycles this run (5 min apart); default 9'
        required: false
        default: '9'

permissions:
  issues: write
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Probe production (rolling 5-min cycles)
        run: |
          set -u
          CYCLES="${{ github.event.inputs.cycles || '9' }}"
          case "$CYCLES" in (*[!0-9]*|'') CYCLES=9;; esac
          FAIL=0

          check () {
            local name="$1" url="$2" pattern="${3:-}"
            local body code ok=0
            for attempt in 1 2 3; do
              body=$(curl -sS -m 20 "$url" 2>&1) && code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "$url" 2>/dev/null) || code="000"
              if [ "$code" = "200" ] && { [ -z "$pattern" ] || echo "$body" | grep -qE "$pattern"; }; then
                ok=1; break
              fi
              sleep 10
            done
            if [ "$ok" = "1" ]; then
              REPORT="$REPORT
          ✅ $name — 200 OK"
            else
              REPORT="$REPORT
          🔴 $name — HTTP $code after 3 attempts — $(echo "$body" | head -c 160 | tr '\n' ' ')"
              FAIL=1
            fi
          }

          for cycle in $(seq 1 "$CYCLES"); do
            REPORT="cycle $cycle/$CYCLES at $(date -u +'%H:%M UTC')"

            # Every visible number/claim maps to a real check:
            check "Ori app (talk-to-me root serves the SPA)"   "https://talk-to-me.ideaflow.page/"              'index-[A-Za-z0-9_-]+\.js'
            check "Ori API health (/proxy/health ok|degraded)" "https://talk-to-me.ideaflow.page/proxy/health"  '"status":"(ok|degraded)"'
            check "Jot website"                                "https://jot-transcribe.com/"                    ''

            if [ "${{ github.event.inputs.force_fail || 'false' }}" = "true" ]; then
              REPORT="$REPORT
          🔴 FORCED TEST FAILURE — this is a drill, production was not checked as down"
              FAIL=1
            fi

            echo "$REPORT"
            echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$REPORT" > /tmp/report.txt

            # Alert immediately on the first failing cycle instead of
            # finishing the window.
            [ "$FAIL" = "1" ] && break
            [ "$cycle" -lt "$CYCLES" ] && sleep 290
          done

          echo "FAIL=$FAIL" >> "$GITHUB_ENV"
          # don't exit yet — the issue steps below need to run first

      - name: Open / update incident issue
        if: env.FAIL == '1'
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Ori/Jot production incident in:title" --json number --jq '.[0].number // empty')
          body="Automated uptime probe failed at $(date -u +'%Y-%m-%d %H:%M UTC').

          $(cat /tmp/report.txt)

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          Triage: ssh to the VPS, \`cortex-runports\` status for port 3004, and check the ideaflow gateway."
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🔴 Ori/Jot production incident — $(date -u +'%Y-%m-%d %H:%M UTC')" \
              --body "$body"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

      - name: Close incident on recovery
        if: env.FAIL == '0'
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Ori/Jot production incident in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ Recovered — all checks passing at $(date -u +'%Y-%m-%d %H:%M UTC').

          $(cat /tmp/report.txt)"
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Fail the run so GitHub sends the notification email
        if: env.FAIL == '1'
        run: exit 1
